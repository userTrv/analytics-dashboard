<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pulse Analytics</title>
    <base href="./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pulse Analytics — an in-browser BI dashboard built with Angular 22, signals and a Web Worker aggregation engine on a synthetic dataset." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply the saved/OS theme before first paint (mirrors ThemeService).
      try {
        var t = localStorage.getItem('pulse.theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Pulse Analytics needs JavaScript — the whole dashboard runs in your browser.</noscript>
  </body>
</html>
